buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

// One codebase, two release files. The resource also selects egg balance at runtime.
def oceanSettings = new Properties()
file('src/main/resources/bond_beyond_ocean.properties').withInputStream { oceanSettings.load(it) }
def oceanProfile = oceanSettings.getProperty('profile')
if (!(oceanProfile in ['tectonic', 'vanilla-ocean'])) {
    throw new GradleException('Unknown Bond Beyond ocean profile: ' + oceanProfile)
}

group = mod_group
version = mod_version + '-' + oceanProfile

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

minecraft {
    mappings channel: 'official', version: mc_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile',
                    "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            jvmArgs '-Xms512m', '-Xmx2048m'
        }

        server {
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id,
                    '--all',
                    '--output',
                    file('src/generated/resources/'),
                    '--existing',
                    file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    minecraft "net.minecraftforge:forge:" +
            "${mc_version}-${forge_version}"

    implementation fg.deobf(
            'curse.maven:citadel-331936:5075402'
    )

    implementation fg.deobf(
            'curse.maven:ice-and-fire-dragons-264231:5633453'
    )

    // Development HUD for entity health and other live values in runClient.
    // Optional at runtime and not bundled into Bond Beyond's output jar.
    runtimeOnly fg.deobf(
            'curse.maven:jade-324717:8479276'
    )

    if (oceanProfile == 'tectonic') {
        runtimeOnly fg.deobf(
                'curse.maven:tectonic-686836:5676419'
        )
    }
}

mixin {
    add sourceSets.main, 'iceandfire_bond_beyond.refmap.json'
    config 'iceandfire_bond_beyond.mixins.json'
}

tasks.named(
        'processResources',
        ProcessResources
).configure {
    def replaceProperties = [
            minecraft_version: mc_version,
            forge_version: forge_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: project.version
    ]

    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                'Specification-Title':
                        mod_name,
                'Specification-Vendor':
                        'Bond Beyond',
                'Specification-Version':
                        '1',
                'Implementation-Title':
                        project.name,
                'Implementation-Version':
                        project.jar.archiveVersion,
                'Implementation-Vendor':
                        'Bond Beyond',
                'Implementation-Timestamp':
                        new Date().format(
                                "yyyy-MM-dd'T'HH:mm:ssZ"
                        )
        ])
    }
}

jar.finalizedBy('reobfJar')
